name: Kalshi snapshot

on:
  schedule:
    # every 10 min, 14:00-05:50 UTC (roughly 10am ET through 12:50am ET).
    # Runs past 03:30 so late West-Coast tips (a 9pm CT Portland game ends
    # around 04:15 UTC) get graded the same night instead of waiting for
    # the next morning's run.
    #
    # Was */30. Two reasons it moved:
    #  1. This snapshot is what the Fair Value Board prices off, and that board
    #     is a PRICE tool — a 30-min-old quote is a wrong number, not a weaker
    #     one. Measured on the live site at 41 min, past the page's own 35-min
    #     "too old to act on" threshold.
    #  2. GitHub's scheduled runs are best-effort and get dropped under load —
    #     this repo has seen 1 of ~7 expected runs fire in a window. Three times
    #     the shots on goal is redundancy as much as freshness.
    # Cost is ~90 bot commits/day instead of ~30, which is fine for a data repo.
    - cron: '*/10 14-23 * * *'
    - cron: '*/10 0-5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_kalshi_wnba.py'
      - 'scripts/fetch_kalshi_mlb.py'
      - 'scripts/wnba_log.py'
      - 'scripts/verify_wnba_parity.py'
      - 'scripts/mlb_log.py'
      - 'scripts/football_log.py'
      - 'scripts/verify_mlb_parity.py'
      - '.github/workflows/kalshi-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: kalshi-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Kalshi markets
        run: |
          python scripts/fetch_kalshi_wnba.py
          python scripts/fetch_kalshi_mlb.py
      # Gate: the logger reimplements the model that lives in the HTML. If the
      # two ever drift, the logged track record stops describing what the site
      # shows — so fail loudly rather than record predictions nobody made.
      - name: Verify WNBA model parity (page vs logger)
        run: python scripts/verify_wnba_parity.py
      - name: Verify MLB model parity (page vs logger)
        run: python scripts/verify_mlb_parity.py
      - name: Log & grade WNBA predictions
        run: python scripts/wnba_log.py
      - name: Log & grade MLB predictions (+ closing line)
        run: python scripts/mlb_log.py
      - name: Capture NFL / CFB closing lines
        run: python scripts/football_log.py
      # These files are regenerated every run, so a rebase against a concurrent
      # human commit can conflict on them (it did). Instead: re-base onto the
      # current remote with a mixed reset, which keeps the freshly generated
      # files in the working tree and drops any stale index state, then commit
      # them on top. Retry to survive a push race.
      - name: Commit snapshot if changed
        run: |
          git config user.name "kalshi-snapshot-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q origin/main
            git add data/kalshi_wnba.json data/kalshi_mlb.json \
                    data/wnba_predictions.json data/wnba_bets.json \
                    data/mlb_predictions.json data/football_lines.json
            if git diff --cached --quiet; then
              echo "no changes"; exit 0
            fi
            git commit -q -m "Kalshi snapshot + prediction logs"
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push race on attempt $attempt, retrying"
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
